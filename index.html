            // Add more levels as needed


        ];


        var currentLevel = 0;
        var totalLives = 5; // Define the total number of lives as a number
        var currentLives = totalLives;
        var resetCount = 0;
        var totalWin = 0;
        var score = 0;
        var elementPlacement = { // Initialize element placement statistics
            correct: 0,
            incorrect: 0
        };

        $(function () {

            loadLevel(levels[currentLevel]);

            $(".element").draggable({
                revert: function (dropped) {
                    if (!dropped) {
                        // If not dropped, revert the element to its starting position
                        $(this).removeClass("droppable-highlight"); // Remove highlight class if present
                        return true;
                    } else {
                        // If dropped, keep it in the droppable if it's correct
                        return !$(this).hasClass("droppable-highlight");
                    }
                },
                start: function (event, ui) {
                    $(".ui-droppable").removeClass("ui-state-hover");
                }
            });

            $(".droppable").droppable({
                drop: function (event, ui) {
                    var category = $(this).attr("id").replace("droppable-", "");
                    var elementCategory = ui.draggable.data("category");
                    if (category === elementCategory) {
                        elementPlacement.correct++;
                        updateScore();
                        $(ui.draggable).addClass("droppable-highlight");
                    } else {
                          elementPlacement.incorrect++;
            updateScore();

            const $dropZone = $(this);
            $dropZone.addClass("droppable-wrong");
            deductLife();

            // REMOVE red color after 2 seconds
            setTimeout(function () {
                $dropZone.removeClass("droppable-wrong");
            }, 1500);
                    }
                    enableNextLevelButton(); // Check if all elements are correctly placed
                },
                out: function (event, ui) {
                    $(this).removeClass("droppable-wrong");
                    $(this).removeClass("droppable-highlight"); // Remove highlight from the droppable
                    $(ui.draggable).removeClass("droppable-highlight"); // Remove highlight from the draggable
                    enableNextLevelButton(); // Check if all elements are correctly placed
                }
            });



            $("#next-level-btn").click(function () {
                if (currentLevel < levels.length - 2) {
                    currentLevel++;
                    $("#elements-container").empty(); // Reset elements
                    loadLevel(levels[currentLevel]);
                    currentLives = totalLives;
                    $("#heart-indicator").text("❤️".repeat(totalLives));
                    $("#next-level-btn").prop("disabled", true);
                } else {
                    totalWin++;
                    resetCount--;
                    updateStatistics();
                    resetGame();

                    alert("Congratulations! You have completed all levels.");
                }
            });

            // Reset button click event handler
            $("#reset-btn").click(function () {
                resetGame();
            });

            function checkAllPlaced() {
                var allPlaced = true;
                $(".element").each(function () {
                    if (!$(this).hasClass("droppable-highlight")) {
                        allPlaced = false;
                        return false; // Exit the loop early if an element is not correctly placed
                    }
                });
                return allPlaced;
            }

            function enableNextLevelButton() {
                if (checkAllPlaced()) {
                    $("#next-level-btn").prop("disabled", false);
                } else {
                    $("#next-level-btn").prop("disabled", true);
                }
            }



            updateStatistics();
        });

        function loadLevel(elements) {
            var allElements = levels.reduce((acc, curr) => acc.concat(curr), []);

            // Shuffle the pool of elements
            allElements = shuffleArray(allElements);

            // Select a subset of elements for the current level
            var subset = allElements.slice(0, elements.length);

            subset.forEach(function (item) {

                var elementDiv = $('<div class="element draggable">' +
                    '<div class="element-symbol">' + item.element + '</div>' +
                    '<div class="element-name">' + item.name + '</div>' +
                    '</div>');




                elementDiv.attr('data-category', item.category); // Add data-category attribute
                $("#elements-container").append(elementDiv);
            });
            // Make newly added elements draggable
            $(".draggable").draggable({
                revert: function (dropped) {
                    if (!dropped) {
                        // If not dropped, revert the element to its starting position
                        $(this).removeClass("droppable-highlight"); // Remove highlight class if present
                        return true;
                    } else {
                        // If dropped, keep it in the droppable if it's correct
                        return !$(this).hasClass("droppable-highlight");
                    }
                },
                start: function (event, ui) {
                    $(".ui-droppable").removeClass("ui-state-hover");
                }
            });
        }

        // Function to shuffle an array
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }


        function deductLife() {
            currentLives--; // Decrement currentLives as a number
            $("#heart-indicator").text("❤️".repeat(currentLives)); // Update the emoji hearts
            if (currentLives === 0) {
                gameOver();
            }
        }

        function resetGame() {
            currentLevel = 0;
            currentLives = totalLives; // Reset lives to the total number of lives
            $("#heart-indicator").text("❤️".repeat(currentLives)); // Update the heart indicator
            $("#elements-container").empty();
            loadLevel(levels[currentLevel]);
            $("#next-level-btn").prop("disabled", true); // Enable next level button
            $(".element").draggable("enable"); // Enable draggable elements
            UpdateXML();
            resetCount++;

            // Reset statistics
            elementPlacement = { correct: 0, incorrect: 0 };
            score = 0;
            totalWin = 0;

            updateStatistics();
            updateScore();



        }

        function gameOver() {
            alert("Oops! Game over! You've run out of lives. Click Reset");

            $("#next-level-btn").prop("disabled", true); // Disable next level button
            $(".element").draggable("disable"); // Disable draggable elements
            // You can add additional logic here for game over actions
            resetGame();

        }

        function updateScore() {
            score = elementPlacement.correct * 10; // Update score based on correct placements
            totalScore = score + (elementPlacement.incorrect * -5);
            $("#score").text("Score: " + totalScore);
            updateStatistics();
        }

        function updateStatistics() {
            // Update the HTML display
            $("#totalWin").text(totalWin);
            $("#reset-count").text("Reset Count: " + resetCount);
            $("#element-placement").text("Element Placement: Correct: " + elementPlacement.correct + ", Incorrect: " + elementPlacement.incorrect);
            $("#score").text("Score: " + totalScore);

            // Prepare data to send

        }
        function UpdateXML() {

            var data = {
                bestScore: totalScore,
                correctElement: elementPlacement.correct,
                incorrectElement: elementPlacement.incorrect,
                totalWin: totalWin
            };

            // Send AJAX request to update_stats.php
            $.ajax({
                type: "POST",
                url: "update-stats.php",
                data: data,
                success: function (response) {
                    console.log("Statistics updated successfully.");
                },
                error: function (xhr, status, error) {
                    console.error("Error updating statistics:", error);
                }
            });
        }
